<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realiza tu pedido</title>
</head>
<body>
    <form action="Procesar-pedido.php" method="post">
        <h1>Pedido de pizza Vladimir</h1>
        
        <fieldset>
            <legend>La pizza</legend>
            <p><strong>Ingredientes:</strong></p>
            <div>
                <input type="checkbox" id="queso" name="queso" value="queso">
                <label for="queso">Queso</label>
            </div>
            <div>
                <input type="checkbox" id="pimiento" name="pimiento" value="pimiento">
                <label for="pimiento">Pimiento</label>
            </div>
            <div>
                <input type="checkbox" id="cebolla" name="cebolla" value="cebolla">
                <label for="cebolla">Cebolla</label>
            </div>
            
            <p><strong>Tamaño:</strong></p>
            <div>
                <input type="radio" id="tam-pequena" name="tamano" value="pequeña" required>
                <label for="tam-pequena">Pequeña</label>
            </div>
            <div>
                <input type="radio" id="tam-mediana" name="tamano" value="mediana" required>
                <label for="tam-mediana">Mediana</label>
            </div>
            <div>
                <input type="radio" id="tam-grande" name="tamano" value="grande" required>
                <label for="tam-grande">Grande</label>
            </div>
        </fieldset>

        <fieldset>
            <legend>Datos de Entrega</legend>
            <p>
                <label for="nombre">Nombre:</label><br>
                <input type="text" id="nombre" name="nombre" required>
            </p>
            <p>
                <label for="hora">Hora Entrega:</label><br>
                <input type="time" id="hora" name="hora">
            </p>
            <p>
                <label for="direccion">Dirección:</label><br>
                <input type="text" id="direccion" name="direccion" required>
            </p>
            <p>
                <label for="telefono">Teléfono:</label><br>
                <input type="tel" id="telefono" name="telefono" required>
            </p>
            <p>
                <label for="correo">E-mail:</label><br>
                <input type="email" id="correo" name="correo">
            </p>
            <p>
                <label for="instrucciones">Instrucciones especiales:</label><br>
                <textarea id="instrucciones" name="instrucciones" cols="40" rows="5"></textarea>
            </p>
        </fieldset>

        <fieldset>
            <legend>Método de pago</legend>
            <p>
                <label for="pago">Selecciona pago:</label><br>
                <select id="pago" name="pago">
                    <option value="efectivo">Efectivo</option>
                    <option value="visa">VISA</option>
                    <option value="bizum">Bizum</option>
                </select>
            </p>
        </fieldset>
        
        <br>
        <input type="submit" value="OK">
        <input type="reset" value="Borrar">
    </form>
</body>
</html>
